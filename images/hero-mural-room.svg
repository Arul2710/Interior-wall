<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" role="img" aria-label="Living room interior with a large hand-painted botanical mural arch on the main wall">
  <title>Living room with a large hand-painted botanical mural</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF5EC"/>
      <stop offset="1" stop-color="#EFE4D5"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9A98A"/>
      <stop offset="1" stop-color="#B08F6E"/>
    </linearGradient>
    <linearGradient id="archG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5E7D6C"/>
      <stop offset="1" stop-color="#33513F"/>
    </linearGradient>
    <linearGradient id="sofaG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7E9A88"/>
      <stop offset="1" stop-color="#5B7666"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#FFF6E4" stop-opacity=".85"/>
      <stop offset="1" stop-color="#FFF6E4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="archClip">
      <path d="M300 780 L300 400 A300 300 0 0 1 900 400 L900 780 Z"/>
    </clipPath>
  </defs>

  <!-- room shell -->
  <rect width="1600" height="1100" fill="url(#wall)"/>
  <rect y="780" width="1600" height="320" fill="url(#floor)"/>
  <rect y="772" width="1600" height="14" fill="#9C7B5C" opacity=".5"/>
  <rect width="1600" height="1100" fill="url(#glow)"/>

  <!-- painted arch mural -->
  <path d="M300 780 L300 400 A300 300 0 0 1 900 400 L900 780 Z" fill="url(#archG)"/>

  <g clip-path="url(#archClip)">
    <circle cx="600" cy="250" r="150" fill="#E7B65C" opacity=".28"/>
    <circle cx="600" cy="250" r="96" fill="#F0C87E" opacity=".3"/>
    <!-- rolling hills -->
    <path d="M240 640 Q420 520 620 618 T1000 596 L1000 820 L240 820 Z" fill="#6F9078"/>
    <path d="M240 706 Q440 616 640 700 T1000 684 L1000 820 L240 820 Z" fill="#43624F"/>
    <!-- botanical stems -->
    <g stroke="#EBDCC4" stroke-width="5" fill="none" stroke-linecap="round" opacity=".9">
      <path d="M380 800 C382 660 392 560 404 452"/>
      <path d="M700 800 C698 668 690 574 676 470"/>
      <path d="M540 800 C544 700 552 640 566 592"/>
    </g>
    <g fill="#EBDCC4" opacity=".92">
      <ellipse cx="372" cy="620" rx="30" ry="14" transform="rotate(-32 372 620)"/>
      <ellipse cx="432" cy="576" rx="30" ry="14" transform="rotate(28 432 576)"/>
      <ellipse cx="378" cy="512" rx="26" ry="12" transform="rotate(-30 378 512)"/>
      <ellipse cx="438" cy="470" rx="26" ry="12" transform="rotate(26 438 470)"/>
      <ellipse cx="728" cy="640" rx="30" ry="14" transform="rotate(30 728 640)"/>
      <ellipse cx="666" cy="588" rx="30" ry="14" transform="rotate(-28 666 588)"/>
      <ellipse cx="722" cy="528" rx="26" ry="12" transform="rotate(30 722 528)"/>
      <ellipse cx="664" cy="482" rx="26" ry="12" transform="rotate(-26 664 482)"/>
      <ellipse cx="546" cy="664" rx="24" ry="11" transform="rotate(-26 546 664)"/>
      <ellipse cx="586" cy="620" rx="24" ry="11" transform="rotate(24 586 620)"/>
    </g>
    <!-- flowers -->
    <g fill="#D2683F">
      <circle cx="404" cy="440" r="26"/><circle cx="404" cy="440" r="11" fill="#F2D79B"/>
      <circle cx="676" cy="456" r="24"/><circle cx="676" cy="456" r="10" fill="#F2D79B"/>
      <circle cx="566" cy="580" r="19"/><circle cx="566" cy="580" r="8" fill="#F2D79B"/>
      <circle cx="330" cy="712" r="17"/><circle cx="330" cy="712" r="7" fill="#F2D79B"/>
      <circle cx="862" cy="700" r="17"/><circle cx="862" cy="700" r="7" fill="#F2D79B"/>
    </g>
    <g fill="#EFC98C" opacity=".85">
      <circle cx="250" cy="470" r="10"/><circle cx="950" cy="520" r="9"/>
      <circle cx="290" cy="380" r="8"/><circle cx="920" cy="410" r="7"/>
    </g>
  </g>
  <!-- arch trim -->
  <path d="M300 780 L300 400 A300 300 0 0 1 900 400 L900 780" fill="none" stroke="#EFE4D5" stroke-width="14"/>

  <!-- floating shelf right -->
  <rect x="1060" y="470" width="330" height="16" rx="8" fill="#A9855F"/>
  <rect x="1060" y="614" width="330" height="16" rx="8" fill="#A9855F"/>
  <g>
    <rect x="1100" y="398" width="46" height="72" rx="6" fill="#C2643C"/>
    <rect x="1156" y="418" width="38" height="52" rx="6" fill="#3D5B50"/>
    <rect x="1204" y="380" width="52" height="90" rx="6" fill="#D9A441"/>
    <ellipse cx="1300" cy="452" rx="34" ry="18" fill="#8FA898"/>
    <path d="M1330 452 q40 -34 74 -6 q-30 30 -74 6" fill="#7E9A88"/>
  </g>
  <g>
    <rect x="1120" y="546" width="120" height="68" rx="6" fill="#EFE4D5" stroke="#D6C4AC" stroke-width="3"/>
    <circle cx="1180" cy="580" r="18" fill="#C2643C" opacity=".8"/>
    <rect x="1262" y="530" width="86" height="84" rx="6" fill="#EFE4D5" stroke="#D6C4AC" stroke-width="3"/>
    <path d="M1278 596 l24 -34 l20 22 l14 -12 l0 24 z" fill="#3D5B50" opacity=".85"/>
  </g>
  <!-- frame above sofa -->
  <rect x="1150" y="250" width="180" height="150" rx="8" fill="#EFE4D5" stroke="#A9855F" stroke-width="8"/>
  <path d="M1168 372 q46 -60 92 -18 q30 -34 52 18 z" fill="#C2643C" opacity=".7"/>

  <!-- floor lamp -->
  <rect x="196" y="330" width="10" height="450" fill="#4A423A"/>
  <path d="M156 330 h90 l-22 -70 h-46 z" fill="#F0E2C8"/>
  <ellipse cx="201" cy="782" rx="46" ry="12" fill="#4A423A"/>

  <!-- rug -->
  <ellipse cx="800" cy="960" rx="620" ry="118" fill="#D8C4A6" opacity=".65"/>
  <ellipse cx="800" cy="960" rx="500" ry="86" fill="#E6D6BC" opacity=".55"/>
  <ellipse cx="800" cy="960" rx="380" ry="58" fill="#C2643C" opacity=".16"/>

  <!-- sofa -->
  <g>
    <rect x="470" y="612" width="620" height="150" rx="34" fill="url(#sofaG)"/>
    <rect x="470" y="700" width="620" height="98" rx="26" fill="#54705F"/>
    <rect x="512" y="640" width="180" height="110" rx="22" fill="#8DA898"/>
    <rect x="712" y="640" width="180" height="110" rx="22" fill="#8DA898"/>
    <rect x="912" y="640" width="150" height="110" rx="22" fill="#8DA898"/>
    <rect x="560" y="662" width="86" height="86" rx="16" fill="#D9A441" transform="rotate(-8 603 705)"/>
    <rect x="900" y="664" width="82" height="82" rx="16" fill="#C2643C" transform="rotate(9 941 705)"/>
    <rect x="470" y="786" width="26" height="44" rx="8" fill="#3B2F26"/>
    <rect x="1064" y="786" width="26" height="44" rx="8" fill="#3B2F26"/>
  </g>

  <!-- coffee table -->
  <g>
    <rect x="620" y="856" width="420" height="20" rx="10" fill="#8E6C4C"/>
    <rect x="656" y="876" width="14" height="76" rx="6" fill="#6F5238"/>
    <rect x="990" y="876" width="14" height="76" rx="6" fill="#6F5238"/>
    <rect x="700" y="824" width="90" height="34" rx="6" fill="#EFE4D5"/>
    <rect x="800" y="818" width="70" height="40" rx="6" fill="#C2643C"/>
    <ellipse cx="920" cy="838" rx="34" ry="16" fill="#3D5B50"/>
  </g>

  <!-- plant -->
  <g>
    <path d="M1330 830 q-12 -110 22 -180" stroke="#4F6B58" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M1336 700 q-70 -46 -104 -6 q52 46 104 6" fill="#6E8C7B"/>
    <path d="M1344 748 q74 -50 112 -4 q-58 48 -112 4" fill="#7E9A88"/>
    <path d="M1326 790 q-66 -40 -96 -2 q50 42 96 2" fill="#5E7D6C"/>
    <path d="M1290 828 h108 l-14 92 h-80 z" fill="#B5714C"/>
    <rect x="1282" y="818" width="124" height="18" rx="8" fill="#C98B62"/>
  </g>

  <!-- soft light beam -->
  <path d="M60 0 L420 0 L900 1100 L360 1100 Z" fill="#FFF3DC" opacity=".14"/>
</svg>
