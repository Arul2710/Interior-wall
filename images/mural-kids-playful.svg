<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="Playful children's mural panel with a rainbow, clouds, sun and simple animal shapes">
  <title>Playful children's mural panel</title>
  <rect width="1000" height="1000" fill="#EAF2F2"/>

  <!-- rainbow -->
  <g fill="none" stroke-width="52" stroke-linecap="butt">
    <path d="M180 720 A320 320 0 0 1 820 720" stroke="#C2643C"/>
    <path d="M240 720 A260 260 0 0 1 760 720" stroke="#E3B05C"/>
    <path d="M300 720 A200 200 0 0 1 700 720" stroke="#6E8C7B"/>
    <path d="M360 720 A140 140 0 0 1 640 720" stroke="#7FA8C4"/>
  </g>

  <!-- clouds -->
  <g fill="#FFFFFF">
    <ellipse cx="180" cy="220" rx="94" ry="52"/><circle cx="120" cy="240" r="44"/><circle cx="240" cy="238" r="50"/>
    <ellipse cx="820" cy="180" rx="80" ry="44"/><circle cx="770" cy="196" r="38"/><circle cx="866" cy="196" r="42"/>
    <ellipse cx="500" cy="120" rx="70" ry="38"/><circle cx="456" cy="132" r="32"/><circle cx="544" cy="132" r="34"/>
  </g>

  <!-- sun -->
  <g>
    <circle cx="820" cy="420" r="90" fill="#E7B65C"/>
    <g stroke="#E7B65C" stroke-width="12" stroke-linecap="round">
      <path d="M820 290 V250"/><path d="M900 340 L930 310"/><path d="M740 340 L710 310"/>
      <path d="M940 420 H980"/><path d="M700 420 H660"/>
    </g>
  </g>

  <!-- hills -->
  <path d="M0 900 Q250 780 500 880 Q750 980 1000 860 L1000 1000 L0 1000 Z" fill="#8FA898"/>
  <path d="M0 950 Q280 880 560 950 Q800 1004 1000 940 L1000 1000 L0 1000 Z" fill="#5E7D6C"/>

  <!-- birds -->
  <g stroke="#4A5259" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M300 300 q26 -22 52 0 q26 -22 52 0"/>
    <path d="M420 250 q18 -16 36 0 q18 -16 36 0"/>
  </g>

  <!-- simple animal shapes -->
  <g>
    <!-- fox -->
    <g transform="translate(220 800)">
      <ellipse cx="0" cy="0" rx="66" ry="44" fill="#C2643C"/>
      <circle cx="-62" cy="-26" r="34" fill="#C2643C"/>
      <path d="M-88 -46 l-10 -44 l38 24 z" fill="#C2643C"/>
      <path d="M-40 -50 l10 -44 l-38 24 z" fill="#C2643C"/>
      <circle cx="-72" cy="-30" r="5" fill="#3A2E28"/>
      <path d="M60 -6 q40 -12 34 -40 q-24 10 -34 26 z" fill="#E8B48C"/>
      <rect x="-40" y="40" width="16" height="34" rx="7" fill="#A9502F"/>
      <rect x="20" y="40" width="16" height="34" rx="7" fill="#A9502F"/>
    </g>
    <!-- bear -->
    <g transform="translate(620 850)">
      <ellipse cx="0" cy="0" rx="60" ry="50" fill="#B98D6A"/>
      <circle cx="-46" cy="-30" r="28" fill="#B98D6A"/>
      <circle cx="34" cy="-34" r="28" fill="#B98D6A"/>
      <circle cx="-46" cy="-30" r="14" fill="#C9A183"/>
      <circle cx="34" cy="-34" r="14" fill="#C9A183"/>
      <circle cx="-40" cy="-34" r="5" fill="#3A2E28"/>
      <circle cx="30" cy="-38" r="5" fill="#3A2E28"/>
      <ellipse cx="-6" cy="-8" rx="18" ry="13" fill="#E4C7A8"/>
      <circle cx="-6" cy="-12" r="6" fill="#3A2E28"/>
      <rect x="-30" y="46" width="18" height="32" rx="8" fill="#9C7350"/>
      <rect x="14" y="46" width="18" height="32" rx="8" fill="#9C7350"/>
    </g>
  </g>

  <!-- confetti dots -->
  <g fill="#E3B05C" opacity=".9">
    <circle cx="120" cy="520" r="12"/><circle cx="900" cy="640" r="10"/><circle cx="520" cy="640" r="8"/>
  </g>
  <g fill="#C98B7E" opacity=".9">
    <circle cx="60" cy="700" r="10"/><circle cx="960" cy="740" r="12"/><circle cx="700" cy="600" r="8"/>
  </g>
</svg>
