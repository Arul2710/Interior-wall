<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img" aria-label="Terrazzo-style speckled hand-painted mural panel with scattered colour chips on a warm cream ground">
  <title>Terrazzo style mural panel</title>
  <defs>
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6EEE1"/>
      <stop offset="1" stop-color="#E7D8C1"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1250" fill="url(#t1)"/>
  <path d="M0 0 H1000 V250 C820 330 640 210 500 280 C340 356 160 250 0 330 Z" fill="#3D5B50" opacity=".14"/>

  <!-- chips: sage -->
  <g fill="#3D5B50">
    <path d="M110 180 l60 -18 l34 44 l-40 40 l-58 -22 z"/>
    <path d="M640 120 l48 22 l-14 50 l-52 6 l-18 -38 z"/>
    <path d="M300 520 l66 -24 l30 48 l-44 38 l-58 -20 z"/>
    <path d="M760 640 l52 18 l-10 46 l-50 12 l-24 -34 z"/>
    <path d="M180 900 l58 20 l-16 48 l-52 4 l-18 -36 z"/>
    <path d="M620 1000 l62 -18 l28 46 l-42 36 l-56 -22 z"/>
  </g>
  <!-- chips: terracotta -->
  <g fill="#C2643C">
    <path d="M400 220 l54 26 l-18 48 l-54 4 l-16 -38 z"/>
    <path d="M860 320 l58 -20 l32 44 l-38 40 l-56 -20 z"/>
    <path d="M120 660 l62 22 l-20 46 l-56 6 l-16 -38 z"/>
    <path d="M460 800 l56 -22 l30 46 l-40 38 l-56 -18 z"/>
    <path d="M840 1080 l54 24 l-16 46 l-52 6 l-18 -36 z"/>
  </g>
  <!-- chips: ochre -->
  <g fill="#D9A441">
    <path d="M700 340 l64 -20 l28 46 l-42 36 l-56 -20 z"/>
    <path d="M240 380 l50 26 l-18 44 l-50 6 l-14 -36 z"/>
    <path d="M540 600 l58 22 l-18 48 l-54 4 l-16 -38 z"/>
    <path d="M60 1120 l62 -18 l28 46 l-40 36 l-56 -20 z"/>
    <path d="M920 800 l48 24 l-16 42 l-48 4 l-12 -34 z"/>
  </g>
  <!-- chips: rose -->
  <g fill="#C98B7E">
    <circle cx="480" cy="420" r="34"/>
    <circle cx="820" cy="480" r="26"/>
    <circle cx="340" cy="700" r="30"/>
    <circle cx="720" cy="880" r="28"/>
    <circle cx="200" cy="1150" r="24"/>
  </g>
  <!-- dots -->
  <g fill="#8C6E52" opacity=".7">
    <circle cx="160" cy="80" r="10"/><circle cx="560" cy="80" r="8"/><circle cx="900" cy="140" r="9"/>
    <circle cx="60" cy="460" r="8"/><circle cx="600" cy="480" r="7"/><circle cx="960" cy="600" r="9"/>
    <circle cx="260" cy="620" r="7"/><circle cx="880" cy="960" r="8"/><circle cx="400" cy="1150" r="9"/>
    <circle cx="700" cy="1190" r="7"/><circle cx="480" cy="960" r="8"/>
  </g>
  <g fill="#F6E3C0" opacity=".85">
    <circle cx="300" cy="300" r="12"/><circle cx="700" cy="720" r="10"/><circle cx="140" cy="780" r="9"/>
  </g>

  <!-- frame edge -->
  <rect x="0" y="0" width="1000" height="1250" fill="none" stroke="#D8C6A8" stroke-width="10"/>
</svg>
