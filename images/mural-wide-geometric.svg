<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Wide geometric hand-painted mural with overlapping arches, circles and colour blocks">
  <title>Wide geometric mural</title>
  <defs>
    <linearGradient id="wg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2E9DA"/>
      <stop offset="1" stop-color="#E2D3BB"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#wg)"/>

  <!-- big arches -->
  <path d="M120 900 V420 A280 280 0 0 1 680 420 V900 Z" fill="#3D5B50"/>
  <path d="M520 900 V500 A240 240 0 0 1 1000 500 V900 Z" fill="#C2643C"/>
  <path d="M900 900 V440 A260 260 0 0 1 1420 440 V900 Z" fill="#D9A441"/>

  <!-- overlapping circles -->
  <circle cx="300" cy="440" r="120" fill="#E3B05C"/>
  <circle cx="300" cy="440" r="66" fill="#F7E7C6"/>
  <circle cx="760" cy="520" r="130" fill="#8FA898"/>
  <circle cx="1160" cy="460" r="110" fill="#C98B7E"/>
  <circle cx="1160" cy="460" r="58" fill="#F2DED8"/>

  <!-- blocks -->
  <rect x="120" y="120" width="200" height="200" rx="24" fill="#2C463B"/>
  <rect x="360" y="170" width="150" height="150" rx="75" fill="#C2643C"/>
  <rect x="560" y="120" width="240" height="70" rx="16" fill="#8FA898"/>
  <rect x="560" y="210" width="240" height="70" rx="16" fill="#3D5B50"/>
  <rect x="880" y="130" width="120" height="120" rx="20" fill="#D9A441" transform="rotate(18 940 190)"/>
  <rect x="1060" y="160" width="180" height="180" rx="90" fill="#3D5B50"/>
  <rect x="1300" y="150" width="180" height="70" rx="16" fill="#C98B7E"/>
  <rect x="1300" y="250" width="180" height="70" rx="16" fill="#2C463B"/>

  <!-- hills at base -->
  <path d="M120 900 V760 Q400 680 700 780 Q1000 880 1420 750 L1420 900 Z" fill="#5E7D6C" opacity=".9"/>

  <!-- baseline + dots -->
  <rect x="80" y="872" width="1440" height="18" rx="9" fill="#2C463B"/>
  <g fill="#C2643C" opacity=".85">
    <circle cx="240" cy="836" r="12"/><circle cx="700" cy="836" r="14"/><circle cx="1180" cy="836" r="12"/>
  </g>
  <g fill="#8FA898" opacity=".6">
    <circle cx="420" cy="70" r="10"/><circle cx="1240" cy="70" r="12"/><circle cx="1500" cy="700" r="10"/>
  </g>
</svg>
