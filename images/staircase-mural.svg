<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-label="Staircase with a climbing botanical hand-painted mural on the adjoining wall">
  <title>Staircase with a climbing mural</title>
  <defs>
    <linearGradient id="sw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F9F3EA"/>
      <stop offset="1" stop-color="#EBE1D1"/>
    </linearGradient>
    <linearGradient id="sm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43624F"/>
      <stop offset="1" stop-color="#2C463B"/>
    </linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFE4D5"/>
      <stop offset="1" stop-color="#D6C7B0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1500" fill="url(#sw)"/>
  <rect y="1300" width="1200" height="200" fill="#C7A585"/>

  <!-- mural block on wall -->
  <rect x="90" y="110" width="620" height="1120" fill="url(#sm)"/>
  <g>
    <circle cx="400" cy="330" r="130" fill="#E7B65C" opacity=".9"/>
    <circle cx="400" cy="330" r="76" fill="#F3D89B" opacity=".9"/>
    <g stroke="#EBDCC4" stroke-width="7" fill="none" stroke-linecap="round" opacity=".9">
      <path d="M220 1220 C230 1000 250 800 268 560"/>
      <path d="M520 1220 C512 1000 500 810 486 620"/>
      <path d="M370 1220 C378 1060 386 940 398 840"/>
      <path d="M620 1220 C614 1080 606 990 596 900"/>
    </g>
    <g fill="#EBDCC4" opacity=".92">
      <ellipse cx="204" cy="1080" rx="52" ry="22" transform="rotate(-32 204 1080)"/>
      <ellipse cx="322" cy="1000" rx="52" ry="22" transform="rotate(28 322 1000)"/>
      <ellipse cx="216" cy="900" rx="44" ry="19" transform="rotate(-30 216 900)"/>
      <ellipse cx="330" cy="820" rx="44" ry="19" transform="rotate(26 330 820)"/>
      <ellipse cx="238" cy="720" rx="38" ry="16" transform="rotate(-28 238 720)"/>
      <ellipse cx="546" cy="1080" rx="52" ry="22" transform="rotate(30 546 1080)"/>
      <ellipse cx="428" cy="1000" rx="52" ry="22" transform="rotate(-28 428 1000)"/>
      <ellipse cx="540" cy="900" rx="44" ry="19" transform="rotate(30 540 900)"/>
      <ellipse cx="424" cy="820" rx="44" ry="19" transform="rotate(-26 424 820)"/>
      <ellipse cx="358" cy="1050" rx="42" ry="18" transform="rotate(-26 358 1050)"/>
      <ellipse cx="430" cy="990" rx="42" ry="18" transform="rotate(24 430 990)"/>
      <ellipse cx="642" cy="1050" rx="38" ry="16" transform="rotate(26 642 1050)"/>
      <ellipse cx="566" cy="980" rx="38" ry="16" transform="rotate(-24 566 980)"/>
    </g>
    <g fill="#D2683F">
      <circle cx="268" cy="530" r="46"/><circle cx="268" cy="530" r="18" fill="#F6E3C0"/>
      <circle cx="486" cy="590" r="42"/><circle cx="486" cy="590" r="16" fill="#F6E3C0"/>
      <circle cx="398" cy="810" r="34"/><circle cx="398" cy="810" r="13" fill="#F6E3C0"/>
      <circle cx="596" cy="870" r="30"/><circle cx="596" cy="870" r="12" fill="#F6E3C0"/>
      <circle cx="150" cy="700" r="26"/><circle cx="150" cy="700" r="10" fill="#F6E3C0"/>
    </g>
    <g fill="#E3B05C" opacity=".85">
      <circle cx="600" cy="420" r="22"/><circle cx="180" cy="420" r="18"/><circle cx="640" cy="1080" r="20"/>
    </g>
  </g>
  <rect x="90" y="110" width="620" height="1120" fill="none" stroke="#EBE1D1" stroke-width="14"/>

  <!-- staircase -->
  <g>
    <!-- stringer shadow -->
    <path d="M740 1230 L740 1300 L1180 1300 L1180 130 L1110 130 L1110 1230 Z" fill="#C7B79B" opacity=".4"/>
    <!-- steps -->
    <g fill="url(#step)" stroke="#CBBBA2" stroke-width="3">
      <rect x="740" y="1180" width="440" height="50" rx="8"/>
      <rect x="740" y="1110" width="400" height="50" rx="8"/>
      <rect x="740" y="1040" width="360" height="50" rx="8"/>
      <rect x="740" y="970" width="320" height="50" rx="8"/>
      <rect x="740" y="900" width="280" height="50" rx="8"/>
      <rect x="740" y="830" width="240" height="50" rx="8"/>
      <rect x="740" y="760" width="200" height="50" rx="8"/>
      <rect x="740" y="690" width="160" height="50" rx="8"/>
      <rect x="740" y="620" width="120" height="50" rx="8"/>
      <rect x="740" y="550" width="90" height="50" rx="8"/>
      <rect x="740" y="480" width="66" height="50" rx="8"/>
      <rect x="740" y="410" width="48" height="50" rx="8"/>
      <rect x="740" y="340" width="34" height="50" rx="8"/>
      <rect x="740" y="270" width="24" height="50" rx="8"/>
      <rect x="740" y="200" width="16" height="50" rx="8"/>
    </g>
    <!-- riser shading -->
    <g fill="#B9A78C" opacity=".55">
      <rect x="740" y="1222" width="440" height="8" rx="4"/>
      <rect x="740" y="1152" width="400" height="8" rx="4"/>
      <rect x="740" y="1082" width="360" height="8" rx="4"/>
      <rect x="740" y="1012" width="320" height="8" rx="4"/>
      <rect x="740" y="942" width="280" height="8" rx="4"/>
      <rect x="740" y="872" width="240" height="8" rx="4"/>
      <rect x="740" y="802" width="200" height="8" rx="4"/>
    </g>
    <!-- handrail -->
    <path d="M748 1160 L1176 130" stroke="#8E6C4C" stroke-width="16" stroke-linecap="round" fill="none"/>
    <g stroke="#8E6C4C" stroke-width="9" stroke-linecap="round">
      <path d="M800 1140 V1074"/><path d="M900 1050 V984"/><path d="M1000 960 V894"/><path d="M1100 870 V804"/>
      <path d="M800 1000 V934"/><path d="M900 910 V844"/><path d="M1000 820 V754"/><path d="M1100 730 V664"/>
      <path d="M800 860 V794"/><path d="M900 770 V704"/><path d="M1000 680 V614"/><path d="M1100 590 V524"/>
      <path d="M800 720 V654"/><path d="M900 630 V564"/><path d="M1000 540 V474"/><path d="M1100 450 V384"/>
      <path d="M800 580 V514"/><path d="M900 490 V424"/><path d="M1000 400 V334"/><path d="M1100 310 V244"/>
    </g>
  </g>

  <!-- console table under stairs -->
  <g>
    <rect x="820" y="1250" width="290" height="18" rx="8" fill="#8E6C4C"/>
    <rect x="842" y="1268" width="14" height="86" rx="6" fill="#6F5238"/>
    <rect x="1074" y="1268" width="14" height="86" rx="6" fill="#6F5238"/>
    <path d="M900 1250 q-34 -4 -34 -46 q0 -42 34 -42 q34 0 34 42 q0 42 -34 46 z" fill="#6E8C7B"/>
    <path d="M900 1166 q-8 -46 -26 -70" stroke="#4F6B58" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="872" cy="1090" r="16" fill="#D9A441"/>
    <rect x="960" y="1212" width="120" height="38" rx="6" fill="#C2643C"/>
  </g>

  <!-- pendant -->
  <g stroke="#8E867C" stroke-width="5" fill="none"><path d="M1000 0 V80"/></g>
  <path d="M958 80 h84 l-20 52 h-44 z" fill="#E7B65C"/>
  <circle cx="1000" cy="142" r="9" fill="#FBF1DC" opacity=".9"/>

  <!-- plant bottom left -->
  <g>
    <path d="M120 1300 q-14 -110 16 -170" stroke="#4F6B58" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M126 1186 q-64 -44 -96 -8 q48 44 96 8" fill="#6E8C7B"/>
    <path d="M130 1236 q70 -48 106 -4 q-54 46 -106 4" fill="#7E9A88"/>
    <path d="M82 1288 h104 l-14 88 h-76 z" fill="#B5714C"/>
    <rect x="74" y="1278" width="120" height="18" rx="8" fill="#C98B62"/>
  </g>
</svg>
