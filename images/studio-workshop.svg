<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" role="img" aria-label="Mural studio workshop with a ladder, sketch boards, paint cans and a partly painted test panel">
  <title>Mural studio workshop</title>
  <defs>
    <linearGradient id="stw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2EBE0"/>
      <stop offset="1" stop-color="#E3D8C6"/>
    </linearGradient>
    <linearGradient id="stf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C3A181"/>
      <stop offset="1" stop-color="#A47F5F"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="1000" fill="url(#stw)"/>
  <rect y="700" width="1400" height="300" fill="url(#stf)"/>
  <!-- plank floor lines -->
  <g stroke="#8E6C4C" stroke-width="3" opacity=".35">
    <path d="M0 760 H1400"/><path d="M0 830 H1400"/><path d="M0 900 H1400"/><path d="M0 960 H1400"/>
  </g>

  <!-- test panel leaning on wall -->
  <g transform="translate(150 300)">
    <rect x="0" y="0" width="440" height="420" rx="8" fill="#EFE4D5" stroke="#A9855F" stroke-width="8"/>
    <path d="M20 400 V170 A200 200 0 0 1 420 170 V400 Z" fill="#3D5B50"/>
    <circle cx="220" cy="200" r="70" fill="#E7B65C"/>
    <path d="M20 340 Q120 280 220 340 Q320 400 420 340 V400 H20 Z" fill="#5E7D6C"/>
    <g stroke="#DCCBB2" stroke-width="2" opacity=".7">
      <path d="M20 100 H420 M20 200 H420 M20 300 H420"/>
      <path d="M120 0 V420 M220 0 V420 M320 0 V420"/>
    </g>
  </g>

  <!-- second panel -->
  <g transform="translate(630 340)">
    <rect x="0" y="0" width="380" height="380" rx="8" fill="#EFE4D5" stroke="#A9855F" stroke-width="8"/>
    <g fill="#C2643C"><rect x="40" y="60" width="120" height="120" rx="20"/><circle cx="270" cy="120" r="60" fill="#D9A441"/></g>
    <path d="M40 240 h300 v40 h-300 z" fill="#3D5B50"/>
    <path d="M40 300 h180 v40 h-180 z" fill="#8FA898"/>
    <circle cx="290" cy="320" r="34" fill="#C98B7E"/>
  </g>

  <!-- ladder -->
  <g>
    <path d="M1090 700 L1050 120 M1180 700 L1140 120" stroke="#B98D2F" stroke-width="18" stroke-linecap="round"/>
    <g stroke="#A87C26" stroke-width="12" stroke-linecap="round">
      <path d="M1060 240 H1130"/><path d="M1050 380 H1140"/><path d="M1040 520 H1150"/><path d="M1030 650 H1160"/>
    </g>
  </g>

  <!-- work bench -->
  <g>
    <rect x="120" y="700" width="560" height="22" rx="8" fill="#8E6C4C"/>
    <rect x="140" y="722" width="18" height="120" rx="7" fill="#6F5238"/>
    <rect x="642" y="722" width="18" height="120" rx="7" fill="#6F5238"/>
    <rect x="120" y="600" width="560" height="16" rx="7" fill="#A9855F"/>
    <!-- jars -->
    <rect x="160" y="546" width="66" height="56" rx="8" fill="#3D5B50"/>
    <rect x="242" y="558" width="56" height="44" rx="8" fill="#C2643C"/>
    <rect x="314" y="540" width="72" height="62" rx="8" fill="#D9A441"/>
    <rect x="402" y="556" width="58" height="46" rx="8" fill="#6E8C7B"/>
    <!-- brushes in jar -->
    <rect x="520" y="520" width="72" height="82" rx="10" fill="#C9BFB2"/>
    <g stroke="#8E6C4C" stroke-width="8" stroke-linecap="round">
      <path d="M534 520 L520 452"/><path d="M552 520 L556 442"/><path d="M572 520 L588 456"/>
    </g>
    <path d="M510 452 h24 v-16 h-24 z" fill="#C2643C"/>
    <path d="M544 442 h24 v-16 h-24 z" fill="#3D5B50"/>
    <path d="M576 456 h24 v-16 h-24 z" fill="#D9A441"/>
    <!-- sketches -->
    <rect x="470" y="668" width="180" height="26" rx="5" fill="#F7F1E6" transform="rotate(-4 560 680)"/>
    <rect x="480" y="642" width="180" height="26" rx="5" fill="#EFE4D5" transform="rotate(3 570 654)"/>
  </g>

  <!-- paint cans on floor -->
  <g>
    <rect x="760" y="820" width="110" height="112" rx="12" fill="#C2643C"/>
    <rect x="752" y="802" width="126" height="26" rx="10" fill="#D97C52"/>
    <rect x="890" y="852" width="96" height="96" rx="12" fill="#3D5B50"/>
    <rect x="882" y="836" width="112" height="24" rx="9" fill="#4F6B58"/>
    <rect x="1000" y="866" width="86" height="86" rx="11" fill="#D9A441"/>
    <rect x="992" y="852" width="102" height="22" rx="8" fill="#E3B05C"/>
  </g>

  <!-- drop cloth -->
  <path d="M660 940 q120 -40 260 -14 q160 30 300 8 q100 -16 180 6 v60 H660 Z" fill="#EDE3D3"/>

  <!-- hanging swatches -->
  <g>
    <path d="M740 0 V90" stroke="#A9855F" stroke-width="4"/>
    <rect x="690" y="90" width="100" height="130" rx="6" fill="#EFE4D5"/>
    <path d="M690 180 h100 v40 h-100 z" fill="#3D5B50"/>
    <circle cx="740" cy="140" r="26" fill="#D9A441"/>
  </g>
</svg>
