
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN | ArtMural Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="images/logo.svg">
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: '#d97706', dark: '#111827' } } }
        }
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
        if (localStorage.getItem('rtl') === 'true') {
            document.documentElement.setAttribute('dir', 'rtl');
        }
    </script>
</head>
<body class="bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-200 transition-colors duration-300">

<div class="fixed top-5 right-5 z-50 flex items-center gap-2">
    <button class="theme-toggle-btn w-11 h-11 rounded-full bg-white dark:bg-gray-800 shadow-lg border border-gray-200 dark:border-gray-700 text-gray-500 hover:text-primary dark:text-gray-400 dark:hover:text-primary transition-all hover:scale-105 focus:outline-none flex items-center justify-center">
        <i class="theme-icon fas fa-moon text-lg"></i>
    </button>
    <button class="rtl-toggle-btn w-11 h-11 rounded-full bg-white dark:bg-gray-800 shadow-lg border border-gray-200 dark:border-gray-700 text-gray-500 hover:text-primary dark:text-gray-400 dark:hover:text-primary transition-all hover:scale-105 focus:outline-none flex items-center justify-center text-sm font-bold">
        RTL
    </button>
</div>

<main>
<section class="min-h-screen relative flex items-center justify-center overflow-hidden px-4 py-16">
    <div class="absolute inset-0 bg-gradient-to-br from-amber-100 via-white to-gray-100 dark:from-gray-900 dark:via-gray-900 dark:to-gray-800"></div>
    <div class="absolute -top-32 -right-32 w-96 h-96 bg-primary/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-32 -left-32 w-96 h-96 bg-amber-300/20 rounded-full blur-3xl"></div>

    <div class="relative max-w-md w-full">
        <div class="absolute inset-0 bg-primary rounded-3xl transform rotate-3 opacity-20"></div>
        <div class="relative bg-white dark:bg-gray-800 p-8 sm:p-10 rounded-3xl shadow-2xl border border-gray-100 dark:border-gray-700">
            <div class="text-center mb-8">
                <a href="index.html" class="flex items-center justify-center gap-3 mb-5">
                    <img src="images/logo.svg" alt="ArtMural" class="h-16 w-16 rounded-2xl shadow-lg shadow-primary/20">
                    <span class="text-4xl font-serif font-bold text-gray-900 dark:text-white tracking-tight">Art<span class="text-primary">Mural</span></span>
                </a>
                <h2 class="text-3xl font-serif font-bold text-gray-900 dark:text-white">Welcome Back</h2>
                <p class="mt-2 text-gray-500 dark:text-gray-400 text-sm">Sign in to continue to your art studio</p>
            </div>

            <form class="space-y-5" onsubmit="event.preventDefault(); window.location.href='user/dashboard.html'">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Email Address</label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                        <input type="email" required placeholder="you@example.com" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl pl-11 pr-4 py-3.5 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all placeholder:text-gray-400 dark:placeholder:text-gray-500">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Password</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                        <input type="password" required placeholder="Enter your password" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl pl-11 pr-12 py-3.5 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all placeholder:text-gray-400 dark:placeholder:text-gray-500">
                        <button type="button" class="password-toggle absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-primary transition-colors focus:outline-none">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="flex justify-between items-center text-sm">
                    <label class="flex items-center text-gray-600 dark:text-gray-400 cursor-pointer">
                        <input type="checkbox" class="mr-2 accent-primary w-4 h-4"> Remember me
                    </label>
                    <a href="#" class="text-primary font-medium hover:underline">Forgot password?</a>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-primary to-amber-500 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-primary/30 hover:shadow-primary/40 hover:-translate-y-0.5 active:translate-y-0">Sign In</button>
            </form>

            <div class="flex items-center gap-4 my-7">
                <div class="flex-1 h-px bg-gray-200 dark:bg-gray-700"></div>
                <span class="text-xs font-semibold uppercase tracking-wider text-gray-400">or continue with</span>
                <div class="flex-1 h-px bg-gray-200 dark:bg-gray-700"></div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-7">
                <button class="flex items-center justify-center gap-2 py-3 rounded-xl border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-900 font-medium text-sm transition-all active:scale-95">
                    <i class="fab fa-google text-red-500"></i> Google
                </button>
                <button class="flex items-center justify-center gap-2 py-3 rounded-xl border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-900 font-medium text-sm transition-all active:scale-95">
                    <i class="fab fa-facebook-f text-blue-600"></i> Facebook
                </button>
            </div>

            <p class="text-center text-gray-500 dark:text-gray-400 text-sm">Don't have an account? <a href="register.html" class="text-primary font-bold hover:underline">Register</a></p>
        </div>
    </div>
</section>

</main>

<script>
    document.querySelectorAll('.password-toggle').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var input = btn.parentElement.querySelector('input');
            var icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
    });
</script>
<script src="js/main.js"></script>
</body>
</html>
